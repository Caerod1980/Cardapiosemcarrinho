<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BebCom Lounge - Cardápio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #f5f5f5;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            color: white;
            text-align: center;
            padding: 25px 20px;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
            border-bottom: 2px solid #dc2626;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcf7f, #4d96ff);
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            z-index: 1000;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid #dc2626;
        }

        .back-button:hover {
            background: rgba(220, 38, 38, 0.9);
            transform: translateX(-5px);
        }

        /* PÁGINA INICIAL - HOME */
        .home-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .home-page.hidden {
            display: none;
        }

        .home-title {
            text-align: center;
            color: white;
            margin-bottom: 50px;
            animation: slideDown 0.6s ease;
        }

        .home-title h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .home-title p {
            font-size: 18px;
            color: #ddd;
            font-weight: 300;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1400px;
            width: 100%;
            animation: fadeIn 0.8s ease;
        }

        .category-button {
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.9) 0%, rgba(45, 45, 45, 0.9) 100%);
            border: 1px solid #333;
            padding: 40px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        .category-button:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(220, 38, 38, 0.3);
            border-color: #dc2626;
        }

        .category-button:active {
            transform: translateY(-5px);
        }

        .category-button.whisky { background: linear-gradient(135deg, #8b6f47 0%, #d4a574 100%); }
        .category-button.gin { background: linear-gradient(135deg, #4a90e2 0%, #87ceeb 100%); }
        .category-button.vodka { background: linear-gradient(135deg, #b0b0b0 0%, #e0e0e0 100%); color: #000; }
        .category-button.vinho { background: linear-gradient(135deg, #8b0000 0%, #d4004a 100%); }
        .category-button.cerveja { background: linear-gradient(135deg, #ffa500 0%, #ffd700 100%); color: #000; }
        .category-button.destilado { background: linear-gradient(135deg, #ee5a6f 0%, #ff6b6b 100%); }
        .category-button.agua { background: linear-gradient(135deg, #1e90ff 0%, #00bfff 100%); }
        .category-button.refri-lata { background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%); }
        .category-button.refri-pet { background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%); }
        .category-button.suco { background: linear-gradient(135deg, #ffa500 0%, #ff8c00 100%); }
        .category-button.energetico { background: linear-gradient(135deg, #9932cc 0%, #da70d6 100%); }
        .category-button.gelo-carvao { background: linear-gradient(135deg, #2f4f4f 0%, #696969 100%); }

        /* PÁGINA DO MENU */
        .menu-page {
            display: none;
            padding: 100px 20px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .menu-page.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .menu-title {
            color: white;
            text-align: center;
            margin-bottom: 40px;
            font-size: 36px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .products-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .product-card {
            background: rgba(26, 26, 26, 0.9);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            animation: slideUp 0.5s ease;
            backdrop-filter: blur(8px);
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 25px rgba(220, 38, 38, 0.2);
            border-color: #dc2626;
        }

        .product-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #f5f5f5;
        }

        .product-info {
            font-size: 16px;
            color: #9ca3af;
            font-style: italic;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border-radius: 15px;
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #dc2626;
            animation: slideUp 0.4s ease;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 24px;
            font-weight: bold;
            color: white;
        }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            transition: color 0.3s ease;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .modal-close:hover {
            color: #dc2626;
            background: rgba(255, 255, 255, 0.1);
        }

        .modal-body {
            padding: 25px;
        }

        .modal-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 25px;
            display: block;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
        }

        .modal-description {
            font-size: 16px;
            line-height: 1.6;
            color: #ddd;
            text-align: center;
            padding: 0 10px;
        }

        /* ANIMAÇÕES */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* RESPONSIVO */
        @media (max-width: 768px) {
            .home-title h1 {
                font-size: 32px;
            }

            .categories-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .menu-page {
                padding: 80px 15px 20px;
            }

            .products-container {
                grid-template-columns: 1fr;
            }

            .back-button {
                padding: 10px 15px;
                font-size: 14px;
            }

            .modal-content {
                max-width: 95%;
                max-height: 85vh;
            }

            .modal-title {
                font-size: 20px;
            }

            .modal-description {
                font-size: 14px;
                padding: 0 5px;
            }
        }

        @media (max-width: 480px) {
            .home-title h1 {
                font-size: 24px;
            }

            .home-title p {
                font-size: 14px;
            }

            .category-button {
                padding: 30px 15px;
                font-size: 16px;
            }

            .menu-title {
                font-size: 24px;
            }

            .modal-header {
                padding: 15px;
            }

            .modal-body {
                padding: 15px;
            }

            .modal-image {
                max-height: 300px;
            }

            .modal-description {
                font-size: 13px;
            }
        }
    </style>
</head>

        // MOSTRAR CATEGORIA
        function showCategory(categoryId, categoryName) {
            document.getElementById('homePage').classList.add('hidden');
            document.getElementById('menuPage').classList.add('show');
            document.querySelector('.back-button').classList.add('show');
            document.getElementById('menuTitle').textContent = categoryName;

            const container = document.getElementById('productsContainer');
            container.innerHTML = '';

            const categoryProducts = products[categoryId] || [];
            categoryProducts.forEach((product, index) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-name">${product.name}</div>
                    <div class="product-info">${product.description}</div>
                `;
                card.addEventListener('click', () => showProductModal(product, categoryId, index));
                container.appendChild(card);
            });
        }

        // MOSTRAR MODAL DO PRODUTO
        function showProductModal(product, categoryId, index) {
            document.getElementById('modalProductName').textContent = product.name;
            document.getElementById('modalProductDescription').textContent = product.modalDescription;
            
            const modalImage = document.getElementById('modalProductImage');
            if (product.imageUrl) {
                modalImage.src = product.imageUrl;
                modalImage.style.display = 'block';
            } else {
                modalImage.style.display = 'none';
            }
            
            document.getElementById('productModal').classList.add('show');
            document.body.style.overflow = 'hidden'; // Impede scroll da página principal
        }

        // FECHAR MODAL
        function closeModal() {
            document.getElementById('productModal').classList.remove('show');
            document.body.style.overflow = 'auto'; // Restaura scroll da página principal
        }

        // FECHAR MODAL AO CLICAR FORA
        document.getElementById('productModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // FECHAR MODAL COM ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && document.getElementById('productModal').classList.contains('show')) {
                closeModal();
            }
        });

        // VOLTAR PARA HOME
        function goHome() {
            document.getElementById('homePage').classList.remove('hidden');
            document.getElementById('menuPage').classList.remove('show');
            document.querySelector('.back-button').classList.remove('show');
            closeModal(); // Fecha modal se estiver aberto
